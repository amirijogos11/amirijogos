<!DOCTYPE html>
<html lang="pt-PT">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>AMIRIJOGOS Creator</title>

<style>

*{
  box-sizing:border-box;
}

:root{
  --bg:#05070b;
  --panel:#0d121c;
  --panel2:#111927;
  --blue:#2388ff;
  --red:#ff234c;
  --purple:#764cff;
  --text:#fff;
  --muted:#9aa7b8;
}

body{
  margin:0;

  font-family:
  Arial,
  Helvetica,
  sans-serif;

  background:#05070b;

  color:white;

  min-height:100vh;
}


/* ===============================
   TOP BAR
================================ */

.topbar{
  height:68px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

  padding:0 20px;

  background:#090d14;

  border-bottom:
  1px solid rgba(255,255,255,.08);

  position:sticky;

  top:0;

  z-index:100;
}

.brand{
  display:flex;

  align-items:center;

  gap:10px;

  font-weight:900;
}

.brand img{
  width:40px;
  height:40px;

  object-fit:cover;

  border-radius:50%;

  border:
  2px solid var(--red);
}

.back{
  color:white;

  text-decoration:none;

  padding:10px 14px;

  background:#172235;

  border-radius:10px;
}


/* ===============================
   LAYOUT
================================ */

.editor{
  min-height:
  calc(100vh - 68px);

  display:grid;

  grid-template-columns:
  250px 1fr 280px;

  background:#05070b;
}


/* ===============================
   SIDE BAR
================================ */

.sidebar{
  background:#090d14;

  border-right:
  1px solid rgba(255,255,255,.07);

  padding:15px;

  overflow:auto;
}

.sidebar h3{
  margin-top:5px;
}

.tool{
  width:100%;

  border:0;

  color:#dce7f7;

  background:#111927;

  border-radius:10px;

  padding:12px;

  margin:5px 0;

  cursor:pointer;

  text-align:left;

  font-weight:700;

  transition:.2s;
}

.tool:hover,
.tool.active{
  background:#18345b;
  transform:translateX(3px);
}


/* ===============================
   MAIN
================================ */

.workspace{
  padding:20px;

  display:flex;

  flex-direction:column;

  min-width:0;
}

.workspace-title{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

  margin-bottom:15px;
}

.workspace-title h1{
  margin:0;

  font-size:
  clamp(22px,4vw,36px);
}


/* ===============================
   CANVAS AREA
================================ */

.preview-area{
  flex:1;

  min-height:480px;

  background:
    radial-gradient(
      circle,
      #172438,
      #070a10 70%
    );

  border-radius:18px;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:auto;

  padding:25px;

  position:relative;
}

#editorCanvas{
  background:#000;

  max-width:100%;
  max-height:68vh;

  box-shadow:
  0 25px 70px rgba(0,0,0,.55);

  border-radius:8px;
}


/* ===============================
   NO VIDEO
================================ */

.empty-editor{
  position:absolute;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  pointer-events:none;

  color:#8390a2;
}

.empty-editor.hide{
  display:none;
}


/* ===============================
   VIDEO HIDDEN
================================ */

#videoSource{
  display:none;
}


/* ===============================
   TIMELINE
================================ */

.timeline{
  background:#0c111a;

  margin-top:15px;

  padding:15px;

  border-radius:14px;

  border:
  1px solid rgba(255,255,255,.06);
}

.timeline-top{
  display:flex;

  justify-content:space-between;

  gap:10px;

  margin-bottom:10px;

  color:#a9b4c4;

  font-size:13px;
}

#seek{
  width:100%;
}

.time-line-controls{
  display:flex;

  gap:8px;

  margin-top:12px;

  flex-wrap:wrap;
}


/* ===============================
   BUTTONS
================================ */

.btn{
  border:0;

  border-radius:10px;

  padding:10px 14px;

  color:#fff;

  background:#1a2638;

  cursor:pointer;

  font-weight:800;
}

.btn:hover{
  filter:brightness(1.15);
}

.btn.blue{
  background:#1767c6;
}

.btn.red{
  background:#bd1438;
}

.btn.green{
  background:#167e4a;
}

.btn.purple{
  background:#6841d7;
}


/* ===============================
   RIGHT PANEL
================================ */

.properties{
  background:#090d14;

  border-left:
  1px solid rgba(255,255,255,.07);

  padding:15px;

  overflow:auto;
}

.panel{
  display:none;
}

.panel.active{
  display:block;
}

.panel h2{
  font-size:20px;
}

.control{
  margin:15px 0;
}

.control label{
  display:block;

  color:#9aa7b8;

  font-size:13px;

  margin-bottom:7px;
}

.control input,
.control select{
  width:100%;

  padding:10px;

  background:#101827;

  border:
  1px solid rgba(255,255,255,.1);

  border-radius:8px;

  color:#fff;
}


/* ===============================
   FORMAT BUTTONS
================================ */

.format-grid{
  display:grid;

  grid-template-columns:
  repeat(2,1fr);

  gap:8px;
}

.format{
  border:
  1px solid rgba(255,255,255,.1);

  background:#111927;

  color:white;

  border-radius:10px;

  padding:12px 5px;

  cursor:pointer;

  font-weight:bold;
}

.format:hover{
  background:#17335b;
}


/* ===============================
   MEMES
================================ */

.meme-search{
  width:100%;

  padding:11px;

  border:1px solid #ffffff18;

  background:#101827;

  border-radius:9px;

  color:white;

  margin-bottom:12px;
}

.meme-grid{
  display:grid;

  grid-template-columns:
  repeat(3,1fr);

  gap:7px;

  max-height:430px;

  overflow:auto;
}

.meme{
  min-height:58px;

  border:1px solid #ffffff12;

  border-radius:10px;

  background:#111927;

  color:white;

  cursor:pointer;

  font-size:23px;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  padding:5px;

  word-break:break-word;
}

.meme.text-meme{
  font-size:11px;

  font-weight:900;
}

.meme:hover{
  transform:scale(1.05);

  background:#18345b;
}


/* ===============================
   TEXT OVERLAY LIST
================================ */

.overlay-list{
  display:grid;

  gap:7px;

  margin-top:12px;
}

.overlay-row{
  background:#101827;

  border-radius:9px;

  padding:8px;

  display:flex;

  justify-content:space-between;

  gap:5px;

  align-items:center;

  font-size:12px;
}


/* ===============================
   STATUS
================================ */

.status{
  font-size:13px;

  color:#89a0bc;

  margin-top:10px;

  min-height:20px;
}


/* ===============================
   MOBILE
================================ */

@media(max-width:950px){

  .editor{
    grid-template-columns:
    190px 1fr;
  }

  .properties{
    position:fixed;

    right:10px;
    top:80px;

    width:280px;

    max-height:
    calc(100vh - 100px);

    z-index:70;

    border:
    1px solid rgba(255,255,255,.1);

    border-radius:14px;

    box-shadow:
    0 20px 60px #000a;
  }

}

@media(max-width:700px){

  .editor{
    display:block;
  }

  .sidebar{
    display:flex;

    overflow-x:auto;

    gap:5px;

    position:sticky;

    top:68px;

    z-index:60;

    border-right:0;

    border-bottom:
    1px solid #ffffff12;
  }

  .sidebar h3{
    display:none;
  }

  .tool{
    min-width:max-content;

    width:auto;
  }

  .properties{
    position:static;

    width:auto;

    max-height:none;

    border-radius:0;

    border:0;
  }

  .preview-area{
    min-height:400px;

    padding:10px;
  }

}

</style>

</head>

</aside>


</div>


<script>

"use strict";


/* ===============================
   ELEMENTOS
================================ */

const video =
document.getElementById(
  "videoSource"
);


const canvas =
document.getElementById(
  "editorCanvas"
);


const ctx =
canvas.getContext(
  "2d"
);


const seek =
document.getElementById(
  "seek"
);


const statusText =
document.getElementById(
  "status"
);


let videoLoaded=false;


let trimStart=0;

let trimEnd=0;


let rotation=0;

let flip=false;


let currentFilter=
"none";


let overlays=[];


let exporting=false;

let mediaRecorder=null;

let recordedChunks=[];


/* ===============================
   TOOLS
================================ */

document
.querySelectorAll(
  ".tool"
)
.forEach(button=>{

  button.addEventListener(
    "click",
    ()=>{

      document
      .querySelectorAll(
        ".tool"
      )
      .forEach(
        b=>
        b.classList.remove(
          "active"
        )
      );


      document
      .querySelectorAll(
        ".panel"
      )
      .forEach(
        panel=>
        panel.classList.remove(
          "active"
        )
      );


      button.classList.add(
        "active"
      );


      document
      .getElementById(
        button.dataset.panel
      )
      .classList.add(
        "active"
      );

    }
  );

});


/* ===============================
   UPLOAD VIDEO
================================ */

document
.getElementById(
  "videoUpload"
)
.addEventListener(
  "change",
  event=>{

    const file=
    event.target.files[0];


    if(!file){
      return;
    }


    const url=
    URL.createObjectURL(
      file
    );


    video.src=
    url;


    video.load();


    statusText.textContent=
    "🎬 A carregar vídeo...";

  }
);


video.addEventListener(
  "loadedmetadata",
  ()=>{

    videoLoaded=true;


    trimStart=0;

    trimEnd=
    video.duration;


    document
    .getElementById(
      "duration"
    )
    .textContent=
    formatTime(
      video.duration
    );


    document
    .getElementById(
      "emptyEditor"
    )
    .classList.add(
      "hide"
    );


    statusText.textContent=
    "✅ Vídeo carregado.";


    drawFrame();

  }
);


/* ===============================
   PLAY
================================ */

document
.getElementById(
  "playButton"
)
.addEventListener(
  "click",
  ()=>{

    if(!videoLoaded){
      return;
    }


    if(video.paused){

      if(
        video.currentTime<
        trimStart ||
        video.currentTime>=
        trimEnd
      ){

        video.currentTime=
        trimStart;

      }


      video.play();


      document
      .getElementById(
        "playButton"
      )
      .textContent=
      "⏸ Pause";


    }else{

      video.pause();


      document
      .getElementById(
        "playButton"
      )
      .textContent=
      "▶ Play";

    }

  }
);


/* ===============================
   SEEK
================================ */

seek.addEventListener(
  "input",
  ()=>{

    if(!videoLoaded){
      return;
    }


    video.currentTime=
    (
      seek.value/
      1000
    )*
    video.duration;


    drawFrame();

  }
);


/* ===============================
   TRIM
================================ */

document
.getElementById(
  "setStart"
)
.onclick=
()=>{

  if(!videoLoaded){
    return;
  }


  trimStart=
  video.currentTime;


  statusText.textContent=
  "✂ Início: "+
  formatTime(
    trimStart
  );

};


document
.getElementById(
  "setEnd"
)
.onclick=
()=>{

  if(!videoLoaded){
    return;
  }


  trimEnd=
  video.currentTime;


  if(
    trimEnd<=trimStart
  ){

    trimEnd=
    video.duration;

  }


  statusText.textContent=
  "✂ Fim: "+
  formatTime(
    trimEnd
  );

};


/* ===============================
   FORMATOS
================================ */

document
.querySelectorAll(
  ".format"
)
.forEach(button=>{

  button.onclick=
  ()=>{

    const format=
    button.dataset.format;


    if(format==="16:9"){

      canvas.width=
      1280;

      canvas.height=
      720;

    }


    if(format==="9:16"){

      canvas.width=
      720;

      canvas.height=
      1280;

    }


    if(format==="1:1"){

      canvas.width=
      1080;

      canvas.height=
      1080;

    }


    if(format==="4:5"){

      canvas.width=
      864;

      canvas.height=
      1080;

    }


    drawFrame();


    statusText.textContent=
    "📐 Formato: "+
    format;

  };

});


/* ===============================
   TEXTO
================================ */

document
.getElementById(
  "addText"
)
.onclick=
()=>{

  const value=
  document
  .getElementById(
    "textInput"
  )
  .value.trim();


  if(!value){
    return;
  }


  overlays.push({

    type:"text",

    text:value,

    x:.5,

    y:.2,

    size:
    Number(
      document
      .getElementById(
        "fontSize"
      )
      .value
    ),

    color:
    document
    .getElementById(
      "textColor"
    )
    .value

  });


  drawFrame();


  statusText.textContent=
  "🔤 Texto adicionado.";

};


/* ===============================
   MEMES
================================ */

const memes=[

  "😂",
  "🤣",
  "😭",
  "💀",
  "☠️",
  "🗿",
  "🤡",
  "🤨",
  "😎",
  "😱",
  "😡",
  "😈",
  "👀",
  "🔥",
  "💯",
  "🚨",
  "📢",
  "🤯",
  "🫡",
  "🥶",
  "😏",
  "🤓",
  "🙃",
  "👑",
  "🐐",
  "🚀",
  "⚠️",
  "❌",
  "✅",

  "BRO 💀",
  "BRUH",
  "NAH 💀",
  "SUS",
  "W",
  "L",
  "GG",
  "EZ",
  "POV",
  "WAIT...",
  "WHAT?!",
  "NO WAY",
  "💀 RIP",
  "LET HIM COOK",
  "BRO...",
  "AIN'T NO WAY",
  "MISSION FAILED",
  "BIG W",
  "BIG L",
  "CLUTCH",
  "1 HP 💀",
  "RUN!",
  "WHY 😭",
  "OMG",
  "LOL",
  "HAHAHA",
  "EMOTIONAL DAMAGE",
  "GAME OVER",
  "VICTORY",
  "EPIC FAIL",
  "TO BE CONTINUED..."

];


const memeGrid=
document.getElementById(
  "memeGrid"
);


function renderMemes(
  search=""
){

  memeGrid.innerHTML="";


  memes
  .filter(
    meme=>
    meme
    .toLowerCase()
    .includes(
      search.toLowerCase()
    )
  )
  .forEach(
    meme=>{

      const button=
      document.createElement(
        "button"
      );


      button.className=
      "meme";


      if(
        meme.length>4
      ){

        button.classList.add(
          "text-meme"
        );

      }


      button.textContent=
      meme;


      button.onclick=
      ()=>{

        overlays.push({

          type:"meme",

          text:meme,

          x:
          .3+
          Math.random()*.4,

          y:
          .3+
          Math.random()*.4,

          size:
          meme.length>4
          ? 45
          : 100

        });


        drawFrame();


        statusText.textContent=
        "😂 Meme adicionado: "+
        meme;

      };


      memeGrid.appendChild(
        button
      );

    }
  );

}


renderMemes();


document
.getElementById(

)

/* ===============================
   DRAW VIDEO
================================ */

function drawVideoCover(){

  if(!videoLoaded){
    return;
  }


  const cw=
  canvas.width;


  const ch=
  canvas.height;


  const vw=
  video.videoWidth;


  const vh=
  video.videoHeight;


  if(
    !vw ||
    !vh
  ){
    return;
  }


  ctx.save();


  ctx.translate(
    cw/2,
    ch/2
  );


  ctx.rotate(
    rotation*
    Math.PI/
    180
  );


  ctx.scale(
    flip
    ? -1
    : 1,
    1
  );


  const rotated=
  Math.abs(rotation)%180===
  90;


  const targetW=
  rotated
  ? ch
  : cw;


  const targetH=
  rotated
  ? cw
  : ch;


  const scale=
  Math.max(
    targetW/vw,
    targetH/vh
  );


  const width=
  vw*scale;


  const height=
  vh*scale;


  ctx.filter=
  currentFilter;


  ctx.drawImage(

    video,

    -width/2,
    -height/2,

    width,
    height

  );


  ctx.restore();


  ctx.filter=
  "none";

}


/* ===============================
   DRAW OVERLAYS
================================ */

function drawOverlays(){

  overlays.forEach(
    overlay=>{

      const x=
      overlay.x*
      canvas.width;


      const y=
      overlay.y*
      canvas.height;


      if(
        overlay.type===
        "text"
      ){

        ctx.save();


        ctx.textAlign=
        "center";


        ctx.textBaseline=
        "middle";


        ctx.font=
        `900 ${overlay.size}px Arial`;


        ctx.lineWidth=
        Math.max(
          3,
          overlay.size*.08
        );


        ctx.strokeStyle=
        "#000";


        ctx.fillStyle=
        overlay.color;


        ctx.strokeText(
          overlay.text,
          x,
          y
        );


        ctx.fillText(
          overlay.text,
          x,
          y
        );


        ctx.restore();

      }


      if(
        overlay.type===
        "meme"
      ){

        ctx.save();


        ctx.textAlign=
        "center";


        ctx.textBaseline=
        "middle";


        ctx.font=
        `900 ${overlay.size}px Arial`;


        ctx.lineWidth=
        Math.max(
          3,
          overlay.size*.08
        );


        ctx.strokeStyle=
        "#000";


        ctx.fillStyle=
        "#fff";


        ctx.strokeText(
          overlay.text,
          x,
          y
        );


        ctx.fillText(
          overlay.text,
          x,
          y
        );


        ctx.restore();

      }


      if(
        overlay.type===
        "image"
      ){

        const width=
        canvas.width*
        overlay.width;


        const ratio=
        overlay.image.height/
        overlay.image.width;


        const height=
        width*
        ratio;


        ctx.drawImage(

          overlay.image,

          x-width/2,

          y-height/2,

          width,

          height

        );

      }

    }
  );

}


/* ===============================
   FRAME
================================ */

function drawFrame(){

  ctx.fillStyle=
  "#000";


  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  drawVideoCover();


  drawOverlays();

}


/* ===============================
   LOOP
================================ */

function loop(){

  if(videoLoaded){

    if(!video.paused){

      if(
        video.currentTime>=
        trimEnd
      ){

        if(exporting){

          stopExport();

        }else{

          video.pause();

          video.currentTime=
          trimStart;


          document
          .getElementById(
            "playButton"
          )
          .textContent=
          "▶ Play";

        }

      }

    }


    drawFrame();


    seek.value=
    video.duration
    ?
    (
      video.currentTime/
      video.duration
    )*
    1000
    :
    0;


    document
    .getElementById(
      "currentTime"
    )
    .textContent=
    formatTime(
      video.currentTime
    );

  }


  requestAnimationFrame(
    loop
  );

}


loop();


/* ===============================
   TIME
================================ */

function formatTime(
  seconds
){

  if(
    !Number.isFinite(
      seconds
    )
  ){

    return "00:00";

  }


  const minutes=
  Math.floor(
    seconds/60
  );


  const secs=
  Math.floor(
    seconds%60
  );


  return
  String(minutes)
  .padStart(
    2,
    "0"
  )
  +
  ":"
  +
  String(secs)
  .padStart(
    2,
    "0"
  );

}


/* ===============================
   EXPORT
================================ */

document
.getElementById(
  "exportButton"
)
.addEventListener(
  "click",
  async()=>{

    if(!videoLoaded){

      statusText.textContent=
      "❌ Primeiro adiciona um vídeo.";

      return;

    }


    if(exporting){
      return;
    }


    recordedChunks=[];


    const canvasStream=
    canvas.captureStream(
      30
    );


    /*
      tenta adicionar áudio
      do vídeo original
    */

    try{

      const videoStream=
      video.captureStream
      ? video.captureStream()
      : null;


      if(videoStream){

        const audioTracks=
        videoStream
        .getAudioTracks();


        audioTracks.forEach(
          track=>
          canvasStream.addTrack(
            track
          )
        );

      }

    }catch(error){

      console.log(
        "Exportação de áudio não disponível:",
        error
      );

    }


    let mime=
    "video/webm";


    if(
      MediaRecorder
      .isTypeSupported(
        "video/webm;codecs=vp9"
      )
    ){

      mime=
      "video/webm;codecs=vp9";

    }


    mediaRecorder=
    new MediaRecorder(

      canvasStream,

      {
        mimeType:mime
      }

    );


    mediaRecorder.ondataavailable=
    event=>{

      if(
        event.data.size>0
      ){

        recordedChunks.push(
          event.data
        );

      }

    };


    mediaRecorder.onstop=
    ()=>{

      const blob=
      new Blob(

        recordedChunks,

        {
          type:"video/webm"
        }

      );


      const url=
      URL.createObjectURL(
        blob
      );


      const a=
      document.createElement(
        "a"
      );


      a.href=
      url;


      a.download=
      canvas.height>
      canvas.width
      ?
      "AMIRIJOGOS-Short.webm"
      :
      "AMIRIJOGOS-Video.webm";


      a.click();


      setTimeout(
        ()=>{

          URL.revokeObjectURL(
            url
          );

        },
        2000
      );


      statusText.textContent=
      "✅ Exportação concluída!";

    };


    exporting=true;


    video.pause();


    video.currentTime=
    trimStart;


    await new Promise(
      resolve=>{

        video.addEventListener(
          "seeked",
          resolve,
          {
            once:true
          }
        );

      }
    );


    mediaRecorder.start(
      100
    );


    statusText.textContent=
    "⏳ A exportar... deixa o vídeo reproduzir até ao fim.";


    try{

      await video.play();

    }catch(error){

      exporting=false;


      mediaRecorder.stop();


      statusText.textContent=
      "❌ Não foi possível iniciar a exportação.";

    }

  }
);


function stopExport(){

  if(!exporting){
    return;
  }


  exporting=false;


  video.pause();


  if(
    mediaRecorder &&
    mediaRecorder.state!==
    "inactive"
  ){

    mediaRecorder.stop();

  }

}

</script>
